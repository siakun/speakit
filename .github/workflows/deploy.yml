name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 질문 노트만 바뀌었을 때는 이 저장소에 커밋이 없으므로 수동으로 다시 배포한다.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 원천: scripts/content-config.mjs의 CONTENT_PREFIX. 아래 sparse-checkout 경로와 함께 고친다.
      SPEAKIT_CONTENT_DIR: .content/speakit/public
    steps:
      - uses: actions/checkout@v7

      # 질문 노트는 비공개 콘텐츠 저장소에 있다. 기본 GITHUB_TOKEN은 이 저장소에만 유효하므로,
      # 콘텐츠 저장소에 읽기 전용으로 설치한 GitHub App의 개인키로 1시간짜리 설치 토큰을 발급받는다.
      - uses: actions/create-github-app-token@v3
        id: content-token
        with:
          app-id: ${{ vars.CONTENT_READER_APP_ID }}
          private-key: ${{ secrets.CONTENT_READER_APP_KEY }}
          owner: siakun-private
          repositories: notes

      - uses: actions/checkout@v7
        with:
          # 원천: scripts/content-config.mjs의 CONTENT_REPOSITORY, CONTENT_PREFIX
          repository: siakun-private/notes
          token: ${{ steps.content-token.outputs.token }}
          path: .content
          sparse-checkout: speakit/public
          # 뒤 단계에서 설치하는 npm 패키지가 토큰을 읽지 못하도록 체크아웃에 자격증명을 남기지 않는다.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # 노트 형식이 깨진 카드를 배포하지 않도록 질문 노트와 샘플 덱을 함께 검사한 뒤 빌드한다.
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
